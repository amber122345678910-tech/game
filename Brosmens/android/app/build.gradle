plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brosmens.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.brosmens.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Постоянный ключ приложения (не в git): android/keystore.properties + keystore.
    // Новые версии с тем же ключом ставятся поверх старых без потери профиля. Без файла — debug-ключ.
    def ksFile = rootProject.file('keystore.properties')
    def ks = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

    signingConfigs {
        brosmens {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (ksFile.exists()) signingConfig signingConfigs.brosmens
        }
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.brosmens : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // веб-часть (меню и игры) лежит в ../web и целиком попадает в assets
    sourceSets {
        main.assets.srcDirs = ['../../web']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
