# StyLua config for SoulVerdict (stylua 2.x). Matches docs/AGENT_GUIDE.md: tabs, double quotes, Luau syntax.
# Format ONLY the files you own:  stylua path/to/YourFile.luau      (never reformat the whole tree)
# tools/check.sh runs `stylua --check src` as an informational step (it never fails the build).
syntax = "Luau"
column_width = 120
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"

[sort_requires]
enabled = false
