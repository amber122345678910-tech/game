<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Рик и Морти: Охота за мега-семенами</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f1a; overflow: hidden; font-family: "Trebuchet MS", sans-serif; touch-action: none; }
  canvas { display: block; margin: 0 auto; background: #10162a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 640;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.width = W; cv.height = H;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.style.marginTop = (innerHeight - H * s) / 2 + 'px';
}
addEventListener('resize', fit); fit();

// ---------- input ----------
const keys = {};
const mouse = { x: W / 2, y: H / 2, down: false };
let touch = null;
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') { e.preventDefault(); portalJump(); } if (e.code === 'Enter') startOrRestart(); if (e.code === 'KeyP') paused = !paused; });
addEventListener('keyup', e => keys[e.code] = false);
function toGame(cx, cy) { const r = cv.getBoundingClientRect(); return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height }; }
cv.addEventListener('mousemove', e => Object.assign(mouse, toGame(e.clientX, e.clientY)));
cv.addEventListener('mousedown', e => { Object.assign(mouse, toGame(e.clientX, e.clientY)); mouse.down = true; if (state !== 'play') startOrRestart(); });
addEventListener('mouseup', () => mouse.down = false);
cv.addEventListener('contextmenu', e => { e.preventDefault(); portalJump(); });
cv.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; touch = toGame(t.clientX, t.clientY); if (state !== 'play') startOrRestart(); if (e.touches.length > 1) portalJump(); }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; touch = toGame(t.clientX, t.clientY); }, { passive: false });
cv.addEventListener('touchend', e => { if (!e.touches.length) touch = null; });

// ---------- sound ----------
let ac = null;
function beep(f, d = 0.08, type = 'square', v = 0.05, slide = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), ac.currentTime + d);
    g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (_) {}
}

// ---------- game state ----------
let state = 'menu', paused = false;
let rick, morty, bullets, enemies, seeds, parts, portals, floaters;
let score, lives, wave, waveTimer, spawnLeft, shootCd, portalCd, invuln, best = +(localStorageGet('rm_best') || 0), shake = 0, t = 0;
function localStorageGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }

const stars = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.3, p: Math.random() * 6 }));
const QUIPS = ['Вабба-лабба-даб-даб!', 'Ох, божечки, Рик!', 'Это было *бульк* легко!', 'Морти, держись!', 'Шлёп-шлёп!', 'Огурчик-Рик!'];

function startOrRestart() {
  if (state === 'play') return;
  rick = { x: W / 2, y: H / 2, r: 16, vx: 0, vy: 0, ang: 0 };
  morty = { x: W / 2 - 40, y: H / 2 + 20, r: 13, trail: [] };
  bullets = []; enemies = []; seeds = []; parts = []; portals = []; floaters = [];
  score = 0; lives = 3; wave = 0; shootCd = 0; portalCd = 0; invuln = 2; shake = 0;
  nextWave();
  state = 'play';
  beep(440, 0.15, 'sawtooth', 0.05, 440);
}

function nextWave() {
  wave++;
  spawnLeft = 6 + wave * 3;
  waveTimer = 0;
  floatText(W / 2, H / 2 - 80, 'Измерение C-' + (130 + wave * 7), '#9cff6b', 2.2, 30);
  for (let i = 0; i < 3; i++) spawnSeed();
}

function spawnSeed() {
  seeds.push({ x: 60 + Math.random() * (W - 120), y: 60 + Math.random() * (H - 120), r: 9, t: Math.random() * 6 });
}

function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x = side === 0 ? -30 : side === 1 ? W + 30 : Math.random() * W;
  let y = side === 2 ? -30 : side === 3 ? H + 30 : Math.random() * H;
  const roll = Math.random();
  let type = 'bug';
  if (wave >= 2 && roll < 0.25) type = 'blue';
  if (wave >= 3 && roll > 0.85) type = 'cronen';
  const base = { bug: { hp: 1, sp: 1.3, r: 14, pts: 10 }, blue: { hp: 1, sp: 2.3, r: 12, pts: 15 }, cronen: { hp: 5, sp: 0.8, r: 24, pts: 50 } }[type];
  enemies.push({ x, y, type, hp: base.hp + Math.floor(wave / 4), sp: base.sp + wave * 0.08, r: base.r, pts: base.pts, t: Math.random() * 6, hit: 0, target: Math.random() < 0.35 ? 'morty' : 'rick', shoot: 120 + Math.random() * 120 });
}

function floatText(x, y, s, c = '#fff', life = 1, size = 18) { floaters.push({ x, y, s, c, life, max: life, size }); }
function burst(x, y, c, n = 14, sp = 4) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = Math.random() * sp; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 30 + Math.random() * 20, c }); }
}

function portalJump() {
  if (state !== 'play' || portalCd > 0) return;
  const tx = touch ? touch.x : mouse.x, ty = touch ? touch.y : mouse.y;
  const dx = tx - rick.x, dy = ty - rick.y, d = Math.hypot(dx, dy) || 1, m = Math.min(d, 260);
  const nx = clamp(rick.x + dx / d * m, 20, W - 20), ny = clamp(rick.y + dy / d * m, 20, H - 20);
  portals.push({ x: rick.x, y: rick.y, life: 40 }, { x: nx, y: ny, life: 40 });
  burst(rick.x, rick.y, '#7dff3a', 20, 5);
  rick.x = nx; rick.y = ny;
  morty.x = nx - 20; morty.y = ny + 10; morty.trail = [];
  burst(nx, ny, '#7dff3a', 20, 5);
  portalCd = 2.2; invuln = Math.max(invuln, 0.5);
  beep(200, 0.35, 'sine', 0.08, 900);
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function hurt(who) {
  if (invuln > 0) return;
  lives--; invuln = 2; shake = 14;
  burst(who.x, who.y, '#ff4d6d', 30, 6);
  floatText(who.x, who.y - 30, who === morty ? 'Ой, Рик, мне больно!' : 'Ауч! *бульк*', '#ff8fa3', 1.4);
  beep(120, 0.4, 'sawtooth', 0.08, -80);
  if (lives <= 0) {
    state = 'over';
    if (score > best) { best = score; localStorageSet('rm_best', best); }
  }
}

// ---------- update ----------
function update(dt) {
  t += dt;
  for (const s of stars) { s.x -= s.s * 0.3; if (s.x < 0) s.x = W; }
  if (state !== 'play' || paused) return;

  // movement
  let ax = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let ay = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  if (touch) { const dx = touch.x - rick.x, dy = touch.y - rick.y, d = Math.hypot(dx, dy); if (d > 12) { ax = dx / d; ay = dy / d; } }
  const al = Math.hypot(ax, ay) || 1;
  rick.vx = (rick.vx + ax / al * 0.9) * 0.86;
  rick.vy = (rick.vy + ay / al * 0.9) * 0.86;
  rick.x = clamp(rick.x + rick.vx, 18, W - 18);
  rick.y = clamp(rick.y + rick.vy, 18, H - 18);

  // Morty follows
  morty.trail.push({ x: rick.x, y: rick.y });
  if (morty.trail.length > 14) { const p = morty.trail.shift(); morty.x += (p.x - 26 - morty.x) * 0.25; morty.y += (p.y + 12 - morty.y) * 0.25; }

  // aim + shoot
  let aimX = mouse.x, aimY = mouse.y, wantShoot = mouse.down || keys.KeyJ || keys.ShiftLeft;
  if (touch || keys.KeyF) {
    let best = null, bd = 1e9;
    for (const e of enemies) { const d = dist(e, rick); if (d < bd) { bd = d; best = e; } }
    if (best && bd < 420) { aimX = best.x; aimY = best.y; wantShoot = true; }
  }
  rick.ang = Math.atan2(aimY - rick.y, aimX - rick.x);
  shootCd -= dt;
  if (wantShoot && shootCd <= 0) {
    shootCd = 0.16;
    const a = rick.ang + (Math.random() - 0.5) * 0.06;
    bullets.push({ x: rick.x + Math.cos(a) * 22, y: rick.y + Math.sin(a) * 22, vx: Math.cos(a) * 10, vy: Math.sin(a) * 10, life: 70, enemy: false });
    beep(880, 0.05, 'square', 0.025, -400);
  }
  portalCd = Math.max(0, portalCd - dt);
  invuln = Math.max(0, invuln - dt);

  // spawning
  waveTimer -= dt;
  if (spawnLeft > 0 && waveTimer <= 0) { spawnEnemy(); spawnLeft--; waveTimer = Math.max(0.35, 1.3 - wave * 0.08); }
  if (spawnLeft === 0 && enemies.length === 0) { score += 100 * wave; floatText(W / 2, H / 2 - 40, 'Волна пройдена! +' + 100 * wave, '#ffe066', 1.8, 26); beep(660, 0.3, 'triangle', 0.07, 660); nextWave(); }

  // bullets
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; b.life--; }
  // enemies
  for (const e of enemies) {
    e.t += dt; e.hit = Math.max(0, e.hit - dt);
    const tgt = e.target === 'morty' ? morty : rick;
    const dx = tgt.x - e.x, dy = tgt.y - e.y, d = Math.hypot(dx, dy) || 1;
    const wob = e.type === 'blue' ? Math.sin(e.t * 6) * 1.5 : 0;
    e.x += dx / d * e.sp + (-dy / d) * wob; e.y += dy / d * e.sp + (dx / d) * wob;
    if (e.type === 'bug' && wave >= 2) {
      e.shoot--;
      if (e.shoot <= 0 && e.x > 0 && e.x < W && e.y > 0 && e.y < H) {
        e.shoot = 160 + Math.random() * 120;
        const a = Math.atan2(rick.y - e.y, rick.x - e.x);
        bullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, life: 160, enemy: true });
      }
    }
    if (dist(e, rick) < e.r + rick.r) hurt(rick);
    else if (dist(e, morty) < e.r + morty.r) hurt(morty);
  }
  // collisions
  for (const b of bullets) {
    if (b.life <= 0) continue;
    if (b.enemy) {
      if (dist(b, rick) < rick.r) { b.life = 0; hurt(rick); }
      else if (dist(b, morty) < morty.r) { b.life = 0; hurt(morty); }
      continue;
    }
    for (const e of enemies) {
      if (e.hp > 0 && dist(b, e) < e.r + 4) {
        b.life = 0; e.hp--; e.hit = 0.1;
        burst(b.x, b.y, '#b6ff8a', 5, 2);
        if (e.hp <= 0) {
          score += e.pts;
          burst(e.x, e.y, e.type === 'cronen' ? '#e8a87c' : e.type === 'blue' ? '#6ecbff' : '#9be15d', 22, 5);
          floatText(e.x, e.y, '+' + e.pts, '#fff', 0.8);
          beep(220, 0.12, 'sawtooth', 0.04, -150);
          if (Math.random() < 0.12) seeds.push({ x: e.x, y: e.y, r: 9, t: 0 });
          if (Math.random() < 0.06) floatText(rick.x, rick.y - 40, QUIPS[Math.floor(Math.random() * QUIPS.length)], '#9cff6b', 1.5, 16);
        }
        break;
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  enemies = enemies.filter(e => e.hp > 0);

  // seeds
  for (const s of seeds) {
    s.t += dt;
    if (dist(s, rick) < s.r + rick.r || dist(s, morty) < s.r + morty.r) {
      s.got = true; score += 25;
      floatText(s.x, s.y, 'Мега-семя! +25', '#ffe066', 1);
      burst(s.x, s.y, '#ffe066', 12, 3);
      beep(990, 0.1, 'triangle', 0.06, 500);
      if (score % 500 < 25 && lives < 5) { lives++; floatText(rick.x, rick.y - 50, '+1 жизнь', '#ff8fa3', 1.2); }
    }
  }
  seeds = seeds.filter(s => !s.got);
  if (seeds.length < 2 && Math.random() < 0.005) spawnSeed();

  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life--; }
  parts = parts.filter(p => p.life > 0);
  for (const p of portals) p.life--;
  portals = portals.filter(p => p.life > 0);
  shake *= 0.85;
}

// ---------- drawing ----------
function drawPortal(x, y, r, a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y);
  for (let i = 4; i > 0; i--) {
    ctx.beginPath(); ctx.ellipse(0, 0, r * i / 4, r * 1.25 * i / 4, t * (i % 2 ? 2 : -2), 0, Math.PI * 2);
    ctx.fillStyle = ['#d6ff9c', '#9cff3a', '#5fd11f', '#2e8a10'][i - 1]; ctx.fill();
  }
  ctx.restore();
}

function drawRick(x, y, ang) {
  ctx.save(); ctx.translate(x, y);
  if (invuln > 0 && Math.floor(t * 12) % 2) ctx.globalAlpha = 0.4;
  // coat
  ctx.fillStyle = '#f2f2f2'; ctx.beginPath(); ctx.ellipse(0, 10, 13, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7fb3d5'; ctx.fillRect(-4, 2, 8, 14);
  // hair spikes
  ctx.fillStyle = '#a8d8ea';
  ctx.beginPath();
  for (let i = 0; i < 9; i++) { const a = Math.PI + i * Math.PI / 8 - 0.2; ctx.lineTo(Math.cos(a) * 20, -8 + Math.sin(a) * 16); ctx.lineTo(Math.cos(a + 0.18) * 10, -8 + Math.sin(a + 0.18) * 8); }
  ctx.closePath(); ctx.fill();
  // face
  ctx.fillStyle = '#f5d6b4'; ctx.beginPath(); ctx.ellipse(0, -6, 10, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#a8d8ea'; ctx.fillRect(-8, -12, 6, 2); ctx.fillRect(2, -12, 6, 2);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-4, -7, 3.2, 0, 7); ctx.arc(4, -7, 3.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-4 + Math.cos(ang), -7 + Math.sin(ang), 1.3, 0, 7); ctx.arc(4 + Math.cos(ang), -7 + Math.sin(ang), 1.3, 0, 7); ctx.fill();
  ctx.strokeStyle = '#6b4b3a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-5, 0); ctx.quadraticCurveTo(0, -2 + Math.sin(t * 8), 5, 0); ctx.stroke();
  // portal gun
  ctx.rotate(ang);
  ctx.fillStyle = '#ddd'; ctx.fillRect(12, -4, 16, 8);
  ctx.fillStyle = '#7dff3a'; ctx.beginPath(); ctx.arc(28, 0, 4, 0, 7); ctx.fill();
  ctx.restore();
}

function drawMorty(x, y) {
  ctx.save(); ctx.translate(x, y);
  if (invuln > 0 && Math.floor(t * 12) % 2) ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#f7e04b'; ctx.beginPath(); ctx.ellipse(0, 9, 11, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f5d6b4'; ctx.beginPath(); ctx.ellipse(0, -5, 10, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6b3e1f'; ctx.beginPath(); ctx.ellipse(0, -11, 10, 5, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-4, -5, 3, 0, 7); ctx.arc(4, -5, 3, 0, 7); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-4, -5, 1, 0, 7); ctx.arc(4, -5, 1, 0, 7); ctx.fill();
  ctx.strokeStyle = '#6b4b3a'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(0, 2, 3, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const flash = e.hit > 0;
  if (e.type === 'bug') {
    ctx.fillStyle = flash ? '#fff' : '#6fbf4a';
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3d7a26'; ctx.lineWidth = 2;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 4, -13); ctx.lineTo(s * 10, -22 + Math.sin(e.t * 8) * 2); ctx.stroke(); }
    ctx.fillStyle = '#d23'; ctx.beginPath(); ctx.arc(-5, -5, 3.5, 0, 7); ctx.arc(5, -5, 3.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#ccc'; ctx.fillRect(-9, 4, 18, 5);
  } else if (e.type === 'blue') {
    ctx.fillStyle = flash ? '#fff' : '#5cb8ff';
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-3, -5, 3, 0, 7); ctx.arc(3, -5, 3, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-3, -5, 1.2, 0, 7); ctx.arc(3, -5, 1.2, 0, 7); ctx.fill();
    ctx.strokeStyle = '#2b6fa8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 3, 4, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.strokeStyle = flash ? '#fff' : '#5cb8ff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-8, 2); ctx.lineTo(-16, -8 + Math.sin(e.t * 10) * 5); ctx.moveTo(8, 2); ctx.lineTo(16, -8 - Math.sin(e.t * 10) * 5); ctx.stroke();
  } else {
    ctx.fillStyle = flash ? '#fff' : '#d99a6c';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, r = 22 + Math.sin(e.t * 4 + i * 2) * 4; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-8, -6, 5, 0, 7); ctx.arc(9, -3, 4, 0, 7); ctx.arc(0, 8, 3, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-8, -6, 2, 0, 7); ctx.arc(9, -3, 1.6, 0, 7); ctx.arc(0, 8, 1.2, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawSeed(s) {
  ctx.save(); ctx.translate(s.x, s.y + Math.sin(s.t * 4) * 3);
  ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 15;
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(0, 0, 7, 10, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff6c2'; ctx.beginPath(); ctx.ellipse(-2, -3, 2, 3, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function text(s, x, y, size, c, align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", sans-serif`; ctx.textAlign = align;
  ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(s, x, y);
  ctx.fillStyle = c; ctx.fillText(s, x, y);
}

function draw() {
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 600);
  g.addColorStop(0, '#1f2a4d'); g.addColorStop(1, '#070a14');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  for (const s of stars) { ctx.globalAlpha = 0.5 + Math.sin(t * 2 + s.p) * 0.4; ctx.fillStyle = '#cfe8ff'; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;

  if (state === 'menu') {
    drawPortal(W / 2, H / 2 - 40, 90);
    drawRick(W / 2 - 40, H / 2 + 100, 0);
    drawMorty(W / 2 + 30, H / 2 + 104);
    text('РИК И МОРТИ', W / 2, 110, 64, '#9cff6b');
    text('Охота за мега-семенами', W / 2, 155, 26, '#ffe066');
    text('WASD / стрелки — движение   •   мышь — прицел, ЛКМ — стрелять', W / 2, H - 120, 18, '#fff');
    text('Пробел / ПКМ — портал-прыжок к курсору   •   P — пауза', W / 2, H - 92, 18, '#fff');
    text('Телефон: веди пальцем — Рик бежит и стреляет сам, двумя пальцами — портал', W / 2, H - 64, 16, '#bbb');
    if (Math.floor(t * 2) % 2) text('Нажми Enter или кликни, чтобы начать', W / 2, H - 22, 22, '#9cff6b');
    ctx.restore(); return;
  }

  for (const p of portals) drawPortal(p.x, p.y, 26, p.life / 40);
  for (const s of seeds) drawSeed(s);
  for (const b of bullets) {
    ctx.fillStyle = b.enemy ? '#ff5577' : '#9cff3a';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.enemy ? 5 : 4, 0, 7); ctx.fill();
  }
  ctx.shadowBlur = 0;
  for (const e of enemies) drawEnemy(e);
  drawMorty(morty.x, morty.y);
  drawRick(rick.x, rick.y, rick.ang);
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / 30); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life / f.max * 2); text(f.s, f.x, f.y - (1 - f.life / f.max) * 30, f.size, f.c); }
  ctx.globalAlpha = 1;

  // HUD
  text('Очки: ' + score, 16, 32, 22, '#fff', 'left');
  text('Волна ' + wave, W / 2, 32, 22, '#9cff6b');
  text('❤'.repeat(Math.max(0, lives)), W - 16, 32, 24, '#ff4d6d', 'right');
  ctx.fillStyle = '#222'; ctx.fillRect(16, 44, 140, 10);
  ctx.fillStyle = portalCd > 0 ? '#3d6b1f' : '#7dff3a'; ctx.fillRect(16, 44, 140 * (1 - portalCd / 2.2), 10);
  text('портал', 162, 54, 12, '#ccc', 'left');

  if (paused) text('ПАУЗА', W / 2, H / 2, 48, '#ffe066');
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    text('ИГРА ОКОНЧЕНА', W / 2, H / 2 - 50, 56, '#ff4d6d');
    text('«Морти, мы *бульк* облажались...»', W / 2, H / 2 - 5, 22, '#a8d8ea');
    text('Очки: ' + score + '   Рекорд: ' + best, W / 2, H / 2 + 40, 26, '#ffe066');
    text('Enter или клик — заново', W / 2, H / 2 + 90, 22, '#9cff6b');
  }
  ctx.restore();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  for (const f of floaters) f.life -= dt;
  if (floaters) floaters = floaters.filter(f => f.life > 0);
  draw();
  requestAnimationFrame(loop);
}
floaters = [];
requestAnimationFrame(loop);
</script>
</body>
</html>
